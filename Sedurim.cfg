@Kopernicus:AFTER[Kopernicus]
{
    Body
    {
        name = Sedirum
        cacheFile = Kerbopause/Cache/Sedirum.bin
        
        // 1. Template: Uses Eeloo as the structural base for an airless ice world
        Template
        {
            name = Eeloo
            removeAllPQSMods = true
        }
        
        // 2. Physical Properties & Orbit Position
        Properties
        {
            displayName = Sedirum^N
            description = A lonely, frozen world skating along the extreme perimeter of the star system, far out beyond the blinding glare of the Kerbopause. Its surface is choked with ancient, deep-red organic tholins. Due to its staggering distance from the sun, the solar arrays on your spacecraft will be practically useless here.
            radius = 120000          // Small planetoid size (120km radius)
            geeASL = 0.04            // Low gravity: roughly 4% of Kerbin's gravity
            rotationPeriod = 36000   // 10-hour rotation period
            isHomeWorld = false
            timewarpAltitudeLimits = 0 1000 5000 10000 20000 50000 100000 300000
            
            ScienceValues
            {
                landedDataValue = 16          // High science yields due to extreme location
                inSpaceLowDataValue = 13
                inSpaceHighDataValue = 11
                recoveryValue = 12
            }
        }
        
        // 3. Orbit: Placed way beyond Kerbopause's 250,000,000,000m orbit
        Orbit
        {
            referenceBody = Sun
            semiMajorAxis = 780000000000   // Over 3x further out than Kerbopause
            eccentricity = 0.857          // Highly egg-shaped orbit
            inclination = 11.9            // Pronounced orbital tilt
            longitudeOfAscendingNode = 144
            argumentOfPeriapsis = 311
            meanAnomalyAtEpoch = 0
            epoch = 0
            color = 0.55, 0.25, 0.15, 1    // Dark, rustic red orbit line in Map View
        }
        
        // 4. ScaledVersion: Textures rendered from deep space
        ScaledVersion
        {
            type = Vacuum
            fadeStart = 15000
            fadeEnd = 20000
            Material
            {
                // Pulls custom texture maps from your PluginData directory
                texture = Kerbopause/PluginData/Sedirum/Sedirum_color.dds
                normals = Kerbopause/PluginData/Sedirum/Sedirum_normal.dds
                
                rimPower = 2.0
                rimBlend = 0.3
                specular = 0.1, 0.1, 0.1, 1.0
                shininess = 0.05
            }
        }
        
        // 5. PQS: Close-up terrain and mountain mesh heights
        PQS
        {
            fadeStart = 15000
            fadeEnd = 20000
            Mods
            {
                // Paints the ground using your color map
                VertexColorMap
                {
                    map = Kerbopause/PluginData/Sedirum/Sedirum_color.dds
                    order = 10
                    enabled = true
                }
                
                // Generates physical hills and craters based on your grayscale map
                VertexHeightMap
                {
                    map = Kerbopause/PluginData/Sedirum/Sedirum_height.dds
                    offset = 0
                    deformity = 3800       // Maximum peak elevations in meters
                    order = 20
                    enabled = true
                }
                
                // Gives the landscape fine, rocky terrain noise up close
                VertexHeightNoiseRegional
                {
                    order = 30
                    enabled = true
                    distortion = 0.1
                    frequency = 4
                    noiseType = Perlin
                }
            }
        }
    }
}
